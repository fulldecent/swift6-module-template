# Release
#
# Open/update the release pull request; build and test the project; and publish the release.
#
# This workflow consumes the following from build-test.yml:
#   1. $.jobs.build-test (this exact job ID)
#   2. The artifact named "build"
#
# Release Please uses release-please-config.json and .release-please-manifest.json.
# The last GitHub release tag is 16.4, which is not SemVer. The manifest records
# that publication as 16.4.0, and later tags are v<major>.<minor>.<patch>.
# skip-github-release is set because this workflow creates the tag after the build.
#
# One-time setup
#   1. Go to GitHub repo > Settings > General > Releases > Enable release immutability.
#   2. Go to GitHub repo > Settings > Actions > General > Workflow permissions: Read and write permissions.
#   3. Under Workflow permissions, check "Allow GitHub Actions to create and approve pull requests".
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.
#
# Check a published file:
#   gh release verify OWNER/REPO v16.4.1
#   gh attestation verify ./libswift6-module-template.a -R OWNER/REPO
#   gh attestation verify ./libswift6-module-template.a -R OWNER/REPO --bundle ./release.sigstore.jsonl
#   gh attestation verify ./libswift6-module-template.a -R OWNER/REPO --bundle ./release.sigstore.jsonl --predicate-type urn:version
#
name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.2.3. Leave empty to open or update the release pull request only.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose:
    name: Open or update the release pull request
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find a merged release pull request
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) v\(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: Build and test
    needs: propose
    if: |
      always() &&
      (needs.propose.result == 'success' || needs.propose.result == 'skipped') &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-test.yml

  publish:
    name: Publish release
    needs: [propose, build-test]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      # Out of dist/ so the version attestation does not take it as a subject.
      - name: Set the provenance bundle aside
        run: mv dist/attestation.sigstore.json "$RUNNER_TEMP/provenance.sigstore.json"

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          case "$TAG" in
            v*.*.*) ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Attest the version
        id: version
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          predicate-type: urn:version
          predicate: ${{ format('{{"version":"{0}"}}', steps.tag.outputs.version) }}

      # dist/* was already attested. Write the sidecar after, so it is not a subject.
      - name: Write the sidecar
        env:
          VERSION_BUNDLE: ${{ steps.version.outputs.bundle-path }}
        run: |
          jq -c . "$RUNNER_TEMP/provenance.sigstore.json" > dist/release.sigstore.jsonl
          jq -c . "$VERSION_BUNDLE" >> dist/release.sigstore.jsonl

      - name: Check the sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*; do
            [ "$f" = dist/release.sigstore.jsonl ] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl \
              --predicate-type urn:version
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # One call, files included. A later upload fails once release immutability is on.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Mark the release pull request tagged
        if: needs.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/autorelease:%20pending"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=autorelease: tagged"
