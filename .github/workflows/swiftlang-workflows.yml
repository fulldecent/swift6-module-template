name: Swiftlang workflows

# Adapted from https://github.com/apple/swift-collections/blob/bdfaffbba691f037100b115d9aa801f05e3d7fe8/.github/workflows/pull_request.yml

on:
  push:
  pull_request:

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      # Package.swift declares swift-tools-version 6.4. Older toolchains cannot load the package.
      linux_swift_versions: '["6.4", "nightly-main", "nightly-6.4.x"]'
      windows_swift_versions: '["6.4", "nightly-main", "nightly-6.4.x"]'
      macos_xcode_versions: '["swift_6.4"]'
      enable_macos_checks: true
      enable_wasm_sdk_build: true

  embedded-swift:
    name: Build with Embedded Swift
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_linux_checks: false
      enable_macos_checks: false
      enable_windows_checks: false
      enable_wasm_sdk_build: false
      enable_embedded_wasm_sdk_build: true
      # The Swift target name. xxPROJECTxNAMExx is the project name, not this target.
      swift_flags: --target "swift6_module_template"

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      # The soundness script expects the Apache header used by Swift.org. This template is MIT.
      license_header_check_enabled: false
      api_breakage_check_container_image: swift:6.4-jammy
      format_check_container_image: swift:6.4-jammy
      docs_check_container_image: swift:6.4-jammy
